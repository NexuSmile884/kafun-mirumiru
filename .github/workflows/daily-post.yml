name: 花粉みるみる Daily Post

on:
  schedule:
    # 朝 7:00 JST = 22:00 UTC (前日)
    - cron: '0 22 * * *'
    # 昼 12:00 JST = 03:00 UTC
    - cron: '0 3 * * *'
    # 夜 20:00 JST = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x-bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TZ: 'Asia/Tokyo'
          # 対象都市は post.js の CITIES を日替わりローテーション（CITY_* env は廃止）
          # 一時的に特定都市へ固定したい場合のみ FORCE_CITY を設定する
        run: node post.js
